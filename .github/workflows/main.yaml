name: vprofile actions
on:
  workflow_dispatch:
env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: vprofileaapp
  EKS_CLUSTER: vprofile-eks

jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches your ~/.m2/repository

      - name: Run tests
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle  

      - name: Setup sonarqube scanner
        uses: sonarsource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.projectKey=vprofile-project
            -Dsonar.organization=vprofile-org
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}  
            -Dsonar.sources=src
            -Dsonar.java.binaries=target/classes  
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.jacoco.reportPaths=target/jacoco.exec
            -Dsonar.junit.reportPaths=target/surefire-reports
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.java.pmd.reportPaths=target/pmd.xml
            -Dsonar.java.findbugs.reportPaths=target/findbugs.xml
            -Dsonar.java.spotbugs.reportPaths=target/spotbugsXml.xml
            -Dsonar.java.cpd.reportPaths=target/cpd.xml

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarcloud-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io